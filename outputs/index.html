<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Triple Arcade</title>
  <style>
    :root{color-scheme:light;--ink:#17202a;--muted:#667085;--line:#d8dde6;--paper:#f7f8fb;--panel:#fff;--title:#6f747b}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(120deg,rgba(58,159,107,.13),transparent 35%),linear-gradient(250deg,rgba(240,178,62,.15),transparent 38%),var(--paper)}.title-bar{display:flex;align-items:center;justify-content:center;min-height:68px;padding:16px 20px;background:var(--title);border-bottom:4px solid #565b61;color:#fff}h1{margin:0;font-size:clamp(28px,4vw,46px);font-weight:800;letter-spacing:0;text-align:center}main{width:min(1500px,100%);margin:0 auto;padding:22px}.arcade-grid{display:grid;grid-template-columns:repeat(3,minmax(280px,1fr));gap:18px;align-items:start}.game{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 10px 26px rgba(23,32,42,.1)}.game-header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:58px;padding:12px 14px;border-bottom:1px solid var(--line)}h2{margin:0;font-size:18px;line-height:1.2;letter-spacing:0}.score{flex:0 0 auto;min-width:96px;padding:6px 9px;border-radius:6px;color:#fff;font-weight:700;font-size:14px;text-align:center;background:#293241}.canvas-wrap{position:relative;aspect-ratio:4/3;background:#cfe6ff}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:grid;gap:10px;padding:12px 14px 14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;line-height:1.35}.buttons{display:flex;flex-wrap:wrap;gap:8px}button{appearance:none;min-height:38px;padding:8px 11px;border:1px solid #b8c0cc;border-radius:6px;color:var(--ink);background:#fff;font:inherit;font-weight:700;cursor:pointer}button:hover,button:focus-visible{border-color:#4f8bd8;outline:2px solid rgba(79,139,216,.2);outline-offset:2px}.tag{color:#344054;font-weight:700}@media(max-width:980px){.arcade-grid{grid-template-columns:1fr}}@media(max-width:520px){main{padding:14px}.game-header{align-items:flex-start;flex-direction:column}.score{width:100%}}
  </style>
</head>
<body>
  <header class="title-bar"><h1>Triple Arcade</h1></header>
  <main><section class="arcade-grid" aria-label="Three playable games">
    <article class="game"><div class="game-header"><h2>Skyline Runner</h2><div class="score" id="runnerScore">Score 0</div></div><div class="canvas-wrap"><canvas id="runner" width="480" height="360" aria-label="Side scrolling runner game"></canvas></div><div class="controls"><div><span class="tag">Side scroller:</span> jump over cones and collect stars.</div><div class="buttons"><button type="button" data-action="runnerJump">Jump</button><button type="button" data-action="runnerRestart">Restart</button></div></div></article>
    <article class="game"><div class="game-header"><h2>Snack Maze</h2><div class="score" id="mazeScore">Score 0</div></div><div class="canvas-wrap"><canvas id="maze" width="480" height="360" aria-label="Top down maze game"></canvas></div><div class="controls"><div><span class="tag">Top down:</span> guide the explorer to snacks while dodging patrols.</div><div class="buttons"><button type="button" data-action="mazeUp">Up</button><button type="button" data-action="mazeLeft">Left</button><button type="button" data-action="mazeDown">Down</button><button type="button" data-action="mazeRight">Right</button><button type="button" data-action="mazeRestart">Restart</button></div></div></article>
    <article class="game"><div class="game-header"><h2>Bubble Blaster</h2><div class="score" id="shooterScore">Score 0</div></div><div class="canvas-wrap"><canvas id="shooter" width="480" height="360" aria-label="Shooter game"></canvas></div><div class="controls"><div><span class="tag">Shooter:</span> move, fire, and clear the drifting bubbles.</div><div class="buttons"><button type="button" data-action="shootLeft">Left</button><button type="button" data-action="shootFire">Fire</button><button type="button" data-action="shootRight">Right</button><button type="button" data-action="shootRestart">Restart</button></div></div></article>
  </section></main>
  <script>
    const keys=new Set(),pressed=new Set();window.addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','w','a','s','d'].includes(e.key))e.preventDefault();keys.add(e.key);pressed.add(e.key)});window.addEventListener('keyup',e=>keys.delete(e.key));const rand=(min,max)=>Math.random()*(max-min)+min;const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;function drawText(ctx,msg,x,y,size=18,color='#17202a'){ctx.fillStyle=color;ctx.font='700 '+size+'px Arial';ctx.textAlign='center';ctx.fillText(msg,x,y)}
    class RunnerGame{constructor(){this.canvas=document.querySelector('#runner');this.ctx=this.canvas.getContext('2d');this.scoreEl=document.querySelector('#runnerScore');this.reset()}reset(){this.player={x:58,y:254,w:34,h:42,vy:0,grounded:true};this.obstacles=[];this.stars=[];this.t=0;this.score=0;this.gameOver=false}jump(){if(this.player.grounded&&!this.gameOver){this.player.vy=-12.8;this.player.grounded=false}}update(){if(pressed.has('ArrowUp')||pressed.has('w')||pressed.has(' '))this.jump();if(this.gameOver)return;this.t++;this.score+=.08;this.player.vy+=.62;this.player.y+=this.player.vy;if(this.player.y>=254){this.player.y=254;this.player.vy=0;this.player.grounded=true}if(this.t%88===0)this.obstacles.push({x:500,y:272,w:28,h:24});if(this.t%126===0)this.stars.push({x:510,y:rand(132,220),w:22,h:22});this.obstacles.forEach(o=>o.x-=4.2);this.stars.forEach(s=>s.x-=3.7);this.obstacles=this.obstacles.filter(o=>o.x>-40);this.stars=this.stars.filter(s=>s.x>-40);this.obstacles.forEach(o=>{if(hit(this.player,o))this.gameOver=true});this.stars=this.stars.filter(s=>{if(hit(this.player,s)){this.score+=10;return false}return true})}draw(){const ctx=this.ctx;ctx.clearRect(0,0,480,360);ctx.fillStyle='#9ed3ff';ctx.fillRect(0,0,480,360);ctx.fillStyle='#eaf7ff';for(let i=0;i<5;i++){const x=((i*130-this.t*1.3)%620)-80;ctx.beginPath();ctx.ellipse(x,76+i%2*28,42,13,0,0,Math.PI*2);ctx.fill()}ctx.fillStyle='#77bd6f';ctx.fillRect(0,296,480,64);ctx.fillStyle='#3f7f58';ctx.fillRect(0,310,480,14);ctx.fillStyle='#3277d6';ctx.fillRect(this.player.x,this.player.y,this.player.w,this.player.h);ctx.fillStyle='#fff';ctx.fillRect(this.player.x+20,this.player.y+9,7,7);ctx.fillStyle='#d65050';this.obstacles.forEach(o=>{ctx.beginPath();ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);ctx.closePath();ctx.fill()});ctx.fillStyle='#f0b23e';this.stars.forEach(s=>{ctx.beginPath();ctx.arc(s.x+11,s.y+11,11,0,Math.PI*2);ctx.fill()});if(this.gameOver)drawText(ctx,'Tap Restart to run again',240,174,21,'#17202a');this.scoreEl.textContent='Score '+Math.floor(this.score)}}
    class MazeGame{constructor(){this.canvas=document.querySelector('#maze');this.ctx=this.canvas.getContext('2d');this.scoreEl=document.querySelector('#mazeScore');this.map=['############','#....#.....#','#.##.#.###.#','#.#.......#.','#.#.#####.#.','#...#...#..#','###.#.#.##.#','#.....#....#','#.#######..#','#..........#','############'];this.cell=30;this.offsetX=60;this.offsetY=15;this.reset()}reset(){this.player={c:1,r:1};this.snack={c:10,r:9};this.guards=[{c:9,r:1,dc:-1,dr:0},{c:2,r:7,dc:1,dr:0}];this.tick=0;this.score=0;this.flash=0}wall(c,r){return r<0||r>=this.map.length||c<0||c>=this.map[r].length||this.map[r][c]==='#'}move(dc,dr){const c=this.player.c+dc,r=this.player.r+dr;if(!this.wall(c,r)){this.player.c=c;this.player.r=r}}moveSnack(){let c=1,r=1;do{c=Math.floor(rand(1,11));r=Math.floor(rand(1,10))}while(this.wall(c,r)||(c===this.player.c&&r===this.player.r));this.snack={c,r}}update(){if(pressed.has('ArrowUp')||pressed.has('w'))this.move(0,-1);if(pressed.has('ArrowDown')||pressed.has('s'))this.move(0,1);if(pressed.has('ArrowLeft')||pressed.has('a'))this.move(-1,0);if(pressed.has('ArrowRight')||pressed.has('d'))this.move(1,0);this.tick++;if(this.tick%30===0)this.guards.forEach(g=>{if(this.wall(g.c+g.dc,g.r+g.dr)){g.dc*=-1;g.dr*=-1}if(!this.wall(g.c+g.dc,g.r+g.dr)){g.c+=g.dc;g.r+=g.dr}});if(this.player.c===this.snack.c&&this.player.r===this.snack.r){this.score+=10;this.moveSnack()}this.guards.forEach(g=>{if(g.c===this.player.c&&g.r===this.player.r){this.score=Math.max(0,this.score-5);this.player={c:1,r:1};this.flash=24}});if(this.flash>0)this.flash--}drawCell(c,r,color){const x=this.offsetX+c*this.cell,y=this.offsetY+r*this.cell;this.ctx.fillStyle=color;this.ctx.fillRect(x,y,this.cell,this.cell)}drawToken(c,r,color,rad){const x=this.offsetX+c*this.cell+this.cell/2,y=this.offsetY+r*this.cell+this.cell/2;this.ctx.fillStyle=color;this.ctx.beginPath();this.ctx.arc(x,y,rad,0,Math.PI*2);this.ctx.fill()}draw(){const ctx=this.ctx;ctx.clearRect(0,0,480,360);ctx.fillStyle=this.flash?'#ffe2e2':'#f8fbff';ctx.fillRect(0,0,480,360);for(let r=0;r<this.map.length;r++)for(let c=0;c<this.map[r].length;c++)this.drawCell(c,r,this.wall(c,r)?'#465160':'#e7edf5');this.drawToken(this.snack.c,this.snack.r,'#f0b23e',10);this.guards.forEach(g=>this.drawToken(g.c,g.r,'#d65050',11));this.drawToken(this.player.c,this.player.r,'#3a9f6b',12);this.scoreEl.textContent='Score '+this.score}}
    class ShooterGame{constructor(){this.canvas=document.querySelector('#shooter');this.ctx=this.canvas.getContext('2d');this.scoreEl=document.querySelector('#shooterScore');this.reset()}reset(){this.ship={x:220,y:304,w:40,h:32};this.shots=[];this.bubbles=[];this.t=0;this.score=0;this.lives=3}fire(){if(this.shots.length<5&&this.lives>0)this.shots.push({x:this.ship.x+18,y:this.ship.y-8,w:5,h:16})}update(){if(keys.has('ArrowLeft')||keys.has('a'))this.ship.x-=5;if(keys.has('ArrowRight')||keys.has('d'))this.ship.x+=5;if(pressed.has('ArrowUp')||pressed.has('w')||pressed.has(' '))this.fire();this.ship.x=Math.max(8,Math.min(432,this.ship.x));this.t++;if(this.lives>0&&this.t%44===0)this.bubbles.push({x:rand(20,430),y:-32,w:30,h:30,vy:rand(1.2,2.7)});this.shots.forEach(s=>s.y-=7);this.bubbles.forEach(b=>b.y+=b.vy);this.shots=this.shots.filter(s=>s.y>-24);this.bubbles=this.bubbles.filter(b=>{if(b.y>380){this.lives--;return false}return true});this.bubbles.forEach(b=>this.shots.forEach(s=>{if(!b.done&&!s.done&&hit(b,s)){b.done=true;s.done=true;this.score+=8}}));this.bubbles=this.bubbles.filter(b=>!b.done);this.shots=this.shots.filter(s=>!s.done);if(this.lives<=0){this.bubbles=[];this.shots=[]}}draw(){const ctx=this.ctx;ctx.clearRect(0,0,480,360);ctx.fillStyle='#1f2937';ctx.fillRect(0,0,480,360);ctx.fillStyle='#fff';for(let i=0;i<45;i++){const x=(i*83+this.t*.4)%480,y=(i*47)%260;ctx.fillRect(x,y,2,2)}ctx.fillStyle='#3a9f6b';ctx.beginPath();ctx.moveTo(this.ship.x+20,this.ship.y);ctx.lineTo(this.ship.x+40,this.ship.y+32);ctx.lineTo(this.ship.x,this.ship.y+32);ctx.closePath();ctx.fill();ctx.fillStyle='#f0b23e';this.shots.forEach(s=>ctx.fillRect(s.x,s.y,s.w,s.h));this.bubbles.forEach(b=>{ctx.fillStyle='#7fc8ff';ctx.beginPath();ctx.arc(b.x+15,b.y+15,15,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke()});drawText(ctx,'Lives '+this.lives,54,28,16,'#fff');if(this.lives<=0)drawText(ctx,'Tap Restart to blast again',240,178,21,'#fff');this.scoreEl.textContent='Score '+this.score}}
    const runner=new RunnerGame(),maze=new MazeGame(),shooter=new ShooterGame();const actions={runnerJump:()=>runner.jump(),runnerRestart:()=>runner.reset(),mazeUp:()=>maze.move(0,-1),mazeDown:()=>maze.move(0,1),mazeLeft:()=>maze.move(-1,0),mazeRight:()=>maze.move(1,0),mazeRestart:()=>maze.reset(),shootLeft:()=>{shooter.ship.x-=22},shootRight:()=>{shooter.ship.x+=22},shootFire:()=>shooter.fire(),shootRestart:()=>shooter.reset()};document.querySelectorAll('button[data-action]').forEach(b=>b.addEventListener('click',()=>actions[b.dataset.action]()));function loop(){runner.update();maze.update();shooter.update();runner.draw();maze.draw();shooter.draw();pressed.clear();requestAnimationFrame(loop)}loop();
  </script>
</body>
</html>
